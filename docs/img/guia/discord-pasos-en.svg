<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" role="img" aria-labelledby="t d">
  <title id="t">Connect an office to Discord in six steps</title>
  <desc id="d">Create the application, copy the token, paste it in the office settings, invite the bot, authorize your ID and send a test.</desc>
  <rect width="760" height="196" rx="18" fill="#12141c"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="28" y="34" fill="#c8c4d4" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.08em">CONNECT DISCORD · ABOUT 5 MINUTES</text><path d="M70 96 H690" stroke="#2a2e3c" stroke-width="4" stroke-linecap="round"/><path d="M70 96 H690" stroke="#5865f2" stroke-width="4" stroke-linecap="round" stroke-dasharray="620" stroke-dashoffset="620"><animate attributeName="stroke-dashoffset" values="620;0;0" keyTimes="0;0.8;1" dur="6s" repeatCount="indefinite"/></path><circle cx="70" cy="96" r="20" fill="#1a1d29" stroke="#5865f2" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#5865f255;#5865f255" keyTimes="0;0.000;0.040;1" dur="6s" repeatCount="indefinite"/></circle><text x="70" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="70" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Create the app</text><text x="70" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">discord.com/developers</text><circle cx="194" cy="96" r="20" fill="#1a1d29" stroke="#5865f2" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#5865f255;#5865f255" keyTimes="0;0.160;0.200;1" dur="6s" repeatCount="indefinite"/></circle><text x="194" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="194" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Copy the token</text><text x="194" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">Bot → Reset Token</text><circle cx="318" cy="96" r="20" fill="#1a1d29" stroke="#5865f2" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#5865f255;#5865f255" keyTimes="0;0.320;0.360;1" dur="6s" repeatCount="indefinite"/></circle><text x="318" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="318" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Paste it</text><text x="318" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">office ⚙ → Discord</text><circle cx="442" cy="96" r="20" fill="#1a1d29" stroke="#5865f2" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#5865f255;#5865f255" keyTimes="0;0.480;0.520;1" dur="6s" repeatCount="indefinite"/></circle><text x="442" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="442" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Invite the bot</text><text x="442" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">button in ⚙</text><circle cx="566" cy="96" r="20" fill="#1a1d29" stroke="#5865f2" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#5865f255;#5865f255" keyTimes="0;0.640;0.680;1" dur="6s" repeatCount="indefinite"/></circle><text x="566" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="566" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Authorize you</text><text x="566" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">mention it, copy ID</text><circle cx="690" cy="96" r="20" fill="#1a1d29" stroke="#3dba7a" stroke-width="2.5"><animate attributeName="fill" values="#1a1d29;#1a1d29;#3dba7a55;#3dba7a55" keyTimes="0;0.800;0.840;1" dur="6s" repeatCount="indefinite"/></circle><text x="690" y="101" fill="#eeeaf8" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="690" y="142" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="middle">Send a test</text><text x="690" y="160" fill="#a9a4b8" font-size="11" font-weight="400" text-anchor="middle">🟢 Connected</text>
  </g>
</svg>
