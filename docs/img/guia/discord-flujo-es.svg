<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="t d">
  <title id="t">Cómo llega un mensaje de Discord a tus IAs</title>
  <desc id="d">Escribes en el teléfono, el bot de la oficina lo recibe, tu PC corre la IA en solo lectura y la respuesta vuelve al canal.</desc>
  <rect width="760" height="300" rx="18" fill="#12141c"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<text x="28" y="34" fill="#c8c4d4" font-size="12" font-weight="400" text-anchor="start" letter-spacing="0.08em">DE TU TELÉFONO A TU OFICINA Y DE VUELTA</text><rect x="36" y="58" width="150" height="196" rx="22" fill="#1a1d29" stroke="#3a3f52" stroke-width="2"/><rect x="86" y="68" width="50" height="5" rx="2.5" fill="#3a3f52"/><g><rect x="50" y="92" width="122" height="46" rx="12" fill="#5865f2"/><text x="60" y="111" fill="#fff" font-size="11.5" font-weight="400" text-anchor="start">@Nave barrida</text><text x="60" y="127" fill="#fff" font-size="11.5" font-weight="400" text-anchor="start">novedades Artemis III</text></g><g opacity="0"><rect x="50" y="176" width="122" height="46" rx="12" fill="#2b2f3f" stroke="#3dba7a" stroke-width="1.5"/><text x="60" y="195" fill="#eeeaf8" font-size="11.5" font-weight="400" text-anchor="start">⚖️ Juez: 3 datos</text><text x="60" y="211" fill="#eeeaf8" font-size="11.5" font-weight="400" text-anchor="start">coinciden, 1 es falso</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.55;0.62;0.95;1" dur="6s" repeatCount="indefinite"/></g><circle cx="330" cy="150" r="46" fill="#5865f222" stroke="#5865f2" stroke-width="2.5"><animate attributeName="r" values="46;50;46" dur="2.4s" repeatCount="indefinite"/></circle><text x="330" y="157" fill="#eeeaf8" font-size="26" font-weight="400" text-anchor="middle">🤖</text><text x="330" y="222" fill="#a9a4b8" font-size="12" font-weight="400" text-anchor="middle">Bot de la oficina</text><text x="330" y="237" fill="#a9a4b8" font-size="12" font-weight="400" text-anchor="middle">sale hacia</text><text x="330" y="252" fill="#a9a4b8" font-size="12" font-weight="400" text-anchor="middle">Discord</text><rect x="470" y="70" width="256" height="170" rx="16" fill="#1a1d29" stroke="#7c5cff" stroke-width="2"/><text x="486" y="96" fill="#eeeaf8" font-size="13" font-weight="600" text-anchor="start">Tu PC · oficina</text><circle cx="510" cy="140" r="17" fill="#d0704f22" stroke="#d0704f" stroke-width="2"/><text x="510" y="145" fill="#d0704f" font-size="12.5" font-weight="700" text-anchor="middle">Cl</text><circle cx="554" cy="140" r="17" fill="#c062d622" stroke="#c062d6" stroke-width="2"/><text x="554" y="145" fill="#c062d6" font-size="12.5" font-weight="700" text-anchor="middle">Gr</text><circle cx="598" cy="140" r="17" fill="#4f8df522" stroke="#4f8df5" stroke-width="2"/><text x="598" y="145" fill="#4f8df5" font-size="12.5" font-weight="700" text-anchor="middle">Ge</text><circle cx="642" cy="140" r="17" fill="#10a37f22" stroke="#10a37f" stroke-width="2"/><text x="642" y="145" fill="#10a37f" font-size="12.5" font-weight="700" text-anchor="middle">Co</text><circle cx="686" cy="140" r="17" fill="#3b6cff22" stroke="#3b6cff" stroke-width="2"/><text x="686" y="145" fill="#3b6cff" font-size="12.5" font-weight="700" text-anchor="middle">Ki</text><rect x="486" y="176" width="110" height="26" rx="13" fill="#3dba7a22" stroke="#3dba7a"/><text x="541" y="193" fill="#c8f5dc" font-size="11.5" font-weight="400" text-anchor="middle">🔒 solo lectura</text><path id="ida1" d="M186 115 C 240 115 250 140 284 140" fill="none" stroke="#3a3f52" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path><path id="ida2" d="M376 140 C 420 140 430 120 470 120" fill="none" stroke="#3a3f52" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path><path id="vuelta1" d="M470 205 C 420 205 410 175 376 168" fill="none" stroke="#3a3f52" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path><path id="vuelta2" d="M284 168 C 240 175 230 199 186 199" fill="none" stroke="#3a3f52" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="7 9"><animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.4s" repeatCount="indefinite"/></path><circle r="5" fill="#5865f2"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" rotate="auto"><mpath href="#ida1"/></animateMotion></circle><circle r="5" fill="#5865f2"><animateMotion dur="3s" begin="1.5s" repeatCount="indefinite" rotate="auto"><mpath href="#ida2"/></animateMotion></circle><circle r="5" fill="#3dba7a"><animateMotion dur="3s" begin="0.75s" repeatCount="indefinite" rotate="auto"><mpath href="#vuelta1"/></animateMotion></circle><circle r="5" fill="#3dba7a"><animateMotion dur="3s" begin="2.25s" repeatCount="indefinite" rotate="auto"><mpath href="#vuelta2"/></animateMotion></circle><text x="616" y="226" fill="#a9a4b8" font-size="11.5" font-weight="400" text-anchor="middle">respuesta + imágenes</text><text x="380" y="282" fill="#a9a4b8" font-size="12" font-weight="400" text-anchor="middle">Sin puertos abiertos ni túnel: el bot llama hacia fuera. Solo obedece a los IDs de Discord que autorices.</text>
  </g>
</svg>
